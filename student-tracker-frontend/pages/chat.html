<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/ui.js"></script>
  <script defer src="../js/chat-ui.js"></script>
  <title>Messages</title> 
</head>

<body>
  <div id="nav"></div>

  <div class="container page">
    <div class="header">
      <div>
        <div class="title">Messages</div>
        <div class="subtitle">Instructor ↔ Student secure messaging</div>
      </div>
      <div class="page-actions">
        <button id="new-thread" class="btn btn-primary" style="display:none;">+ New Message</button>
      </div>
    </div>

    <div class="chat-grid">
      <aside class="card card-fixed chat-sidebar">
        <div class="chat-search">
          <input id="search" class="input" placeholder="Search conversations…" />
        </div>
        <div id="threads" class="chat-list"></div>
      </aside>

      <section class="card card-fixed chat-thread">
        <header class="chat-thread-header">
          <div class="chat-thread-titles">
            <div id="thread-title" class="title" style="font-size:18px;">Select a conversation</div>
            <div id="thread-sub" class="subtitle"></div>
          </div>
          <div id="recipients" class="chat-recipients"></div>
        </header>

        <main id="messages" class="chat-messages"></main>

        <footer class="chat-composer">
          <input id="msg-input" class="input chat-input" placeholder="Type your message…" />
          <button id="send" class="btn btn-primary">Send</button>
        </footer>
      </section>
    </div>
  </div>

  <div id="recip-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 640px;">
      <div class="modal-header">
        <h2>New Message</h2>
        <button class="btn-link" id="btnCloseModal"
          style="font-size: 24px; padding: 0; width: 32px; height: 32px;">&times;</button>
      </div>
      <div class="modal-body">
        <p class="subtitle" style="margin-top: 0; margin-bottom: 16px;">Select people to start a conversation</p>
        <input type="text" id="recip-search" class="search-input-modal" placeholder="Search by name or email..." />
        <div id="recip-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btnCancelRecip">Cancel</button>
        <button class="btn btn-primary" id="btnStartThread">Start Conversation</button>
      </div>
    </div>
  </div>

  <div class="footer">Student Tracker • Messages</div>
</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.mountNav();
      const u = Auth.currentUser();
      if (!u) location.replace('./index.html');
      Chat.init();
    });
  </script>

</html>
